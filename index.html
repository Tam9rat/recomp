<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recomp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#E3E8F0; --line:#D6DCE6;
  --text:#121826; --muted:#5B677B; --accent:#B86A00; --accent-ink:#FFFFFF; --accent-soft:#F6E3C4;
  --good:#23915A; --good-soft:#DCF1E4; --warn:#C0492B; --scrim:rgba(14,19,32,.55);
  --shadow:0 1px 2px rgba(18,24,38,.05),0 10px 30px rgba(18,24,38,.07);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1320; --surface:#161C2C; --surface-2:#20283B; --line:#2A3349;
    --text:#EAF0FA; --muted:#8C98AE; --accent:#F2A93B; --accent-ink:#1B1204; --accent-soft:#3A2F1A;
    --good:#4CC883; --good-soft:#163427; --warn:#FF7A5C; --scrim:rgba(4,6,12,.7);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.display{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-size:46px}
.h2{font-size:28px}
.h3{font-size:21px;font-family:var(--display);font-weight:600;line-height:1.1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:600 16px var(--body);background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:11px}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.divider{height:1px;background:var(--line);margin:4px 0}

/* hero */
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.streak{position:relative;width:84px;height:84px;flex:none}
.streak svg{width:84px;height:84px;transform:rotate(-90deg)}
.streak .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.streak .lbl b{font:700 28px/1 var(--display)}
.streak .lbl span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font:600 13px var(--display);background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.dot.done{background:var(--accent);color:var(--accent-ink)}
.dot.miss{background:transparent;border-color:var(--line);color:var(--muted);opacity:.7}
.dot.today{border-color:var(--accent)}
.dot.done.today{border-color:var(--text)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item:disabled{cursor:default;opacity:.7}
div.item{cursor:default}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.check svg{opacity:0;transform:scale(.6);transition:.15s}
.on>.check,.check.on{background:var(--good);border-color:var(--good);color:#fff}
.on>.check svg,.check.on svg{opacity:1;transform:none}
.item.on .meal-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.time{font:600 14px var(--display);color:var(--muted);width:44px;flex:none}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.bar.good i{background:var(--good)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habit{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;font-size:14px;font-weight:500}
.habit .check{width:24px;height:24px;border-radius:8px}
.habit:last-child:nth-child(odd){grid-column:1/-1}

/* train */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font:600 14px var(--body);white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .today-mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.target{font:600 15px var(--display);color:var(--muted);white-space:nowrap}
.hint{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.hint.up{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font:600 15px var(--display);color:var(--muted);text-align:center}
.set label{position:relative;display:block}
.set input{width:100%;font:600 20px var(--display);font-variant-numeric:tabular-nums;padding:10px 38px 10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);appearance:none;-moz-appearance:textfield}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set input::placeholder{color:var(--muted);opacity:.6}
.set .unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.set-btn{appearance:none;width:48px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.set-btn.on{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:600 20px var(--display);cursor:pointer}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{font:600 18px var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logfor{grid-template-columns:auto 1fr;align-items:center;gap:10px}
.logfor select{font-size:16px;padding:9px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:25;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
#timer .in{pointer-events:auto;max-width:528px;width:100%;background:var(--text);color:var(--bg);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#timer .t{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:66px}
#timer .prog{flex:1;height:6px;border-radius:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#timer .prog i{display:block;height:100%;background:var(--accent)}
#timer button{appearance:none;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:10px;padding:8px 10px;font:600 13px var(--body);cursor:pointer}
#timer.go .in{background:var(--good);color:#fff}
body.timing .app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font:700 28px/1.05 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:500}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.heat i.s1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.s2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i.s3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i.s4{background:var(--accent)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.pre{opacity:.35}
.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.list-row:first-child{border-top:0}
.x-btn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{appearance:none;border:0;padding:0;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--surface-2);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.ph.sel{outline:3px solid var(--accent);outline-offset:-3px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:16px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:grid;gap:6px}
.compare img{border-radius:14px;width:100%;aspect-ratio:3/4;object-fit:cover}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;justify-content:center}
nav.tabs .in{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{appearance:none;background:none;border:0;color:var(--muted);display:grid;justify-items:center;gap:2px;font:600 11px var(--body);padding:6px 0;cursor:pointer;letter-spacing:.02em}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .2s}
.sheet .panel{background:var(--surface);border-radius:24px;padding:18px;width:100%;max-width:528px;max-height:88vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1);margin-bottom:env(safe-area-inset-bottom,0px)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.celebrate{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0 4px}
.medal{width:120px;height:120px;position:relative}
.medal svg{width:120px;height:120px}
.medal .ring{animation:draw 1s cubic-bezier(.3,.7,.2,1) forwards;stroke-dasharray:340;stroke-dashoffset:340}
.medal .tick{animation:draw .45s .75s ease-out forwards;stroke-dasharray:80;stroke-dashoffset:80}
@keyframes draw{to{stroke-dashoffset:0}}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0;animation:spark .9s .6s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateY(-78px)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;animation:up .2s}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.medal .ring,.medal .tick{stroke-dashoffset:0}}
@media (max-width:370px){.h1{font-size:40px}.tiles{grid-template-columns:1fr 1fr}.set{grid-template-columns:22px 1fr 1fr 44px}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<div id="timer" hidden><div class="in"><div><div class="tiny" style="opacity:.7;font-weight:600;letter-spacing:.08em">REST</div><div class="t" id="timer-t">1:30</div></div><div class="prog"><i id="timer-p"></i></div><button data-act="timer-add">+15 s</button><button data-act="timer-skip">Skip</button></div></div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-act="tab" data-tab="train"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Train</button>
  <button data-act="tab" data-tab="progress"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Progress</button>
  <button data-act="tab" data-tab="photos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Photos</button>
</div></nav>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>
<div id="sheet-root"></div>

<script>

      { id: 'facepull', n: 'Face pull', note: 'cable', s: 3, lo: 15, hi: 15, rest: 60, inc: 2.5 },

    case 'extra-add': {
      const n = ($('#ex-n').value.trim() || 'Extra food').slice(0, 40), kc = num($('#ex-k').value), pr = $('#ex-p').value.trim() ? num($('#ex-p').value) : 0;
      if (!(kc >= 1 && kc <= 3000)) { toast('Enter the kcal as a number, like 250'); break; }
      if (!(pr >= 0 && pr <= 200)) { toast('Protein should be a number of grams, like 10'); break; }
      const r = dayRec(todayKey(), true); (r.extra = r.extra || []).push({ n, k: Math.round(kc), p: Math.round(pr * 10) / 10 }); save(); render(); toast(`Added ${n}`); break;
    }
    case 'extra-del': { const r = dayRec(todayKey(), true); r.extra.splice(+d.i, 1); save(); render(); break; }
    case 'view-day': viewOff = +d.off; render(); window.scrollTo(0, 0); break;
    case 'prep': case 'sprep': { const f = d.act, r = dayRec(d.k, true); r[f] = r[f] || []; r[f][+d.i] = !r[f][+d.i]; save(); render(); break; }
    case 'go-foot': tab = 'train'; trainSel = 'FOOT'; logDate = todayKey(); render(); window.scrollTo(0, 0); break;
    case 'go-train': tab = 'train'; trainSel = footSel();  logDate = todayKey(); render(); window.scrollTo(0, 0); break;
    case 'meal': { const r = dayRec(todayKey(), true); r.meals[+d.i] = !r.meals[+d.i]; save(); render(); break; }
    case 'habit': { const r = dayRec(todayKey(), true); r.habits[d.id] = !r.habits[d.id]; save(); render(); break; }
    case 'walk': { const r = dayRec(todayKey(), true); r.walk = !r.walk; save(); render(); if (r.walk) toast('Rest day done — streak kept 🔥'); break; }
    case 'pick-w': trainSel = d.w; render(); break;
    case 'warm': {
      const s = getSession(currentW(), true), i = +d.i;
      if (i === 1) {
        const km = num($('#cf-km') && $('#cf-km').value), mn = num($('#cf-min') && $('#cf-min').value);
        if (s.km && s.min && !(km > 0 && mn > 0 && (km !== s.km || mn !== s.min))) { toast('Run already saved ✓ — change the numbers to edit it'); break; }
        s.km = km > 0 ? km : 2; s.min = mn > 0 ? mn : 10; toast(`Run saved · ${fmt(s.km / (s.min / 60))} km/h`);
      } else { s.warm = s.warm || []; s.warm[i] = !s.warm[i]; }
      save(); render(); break;
    }
    case 'run-quick': { const s = getSession(currentW(), true); s.km = 2; s.min = 10; save(); render(); toast('Run logged · 12 km/h'); break; }
    case 'set': toggleSet(d.ex, +d.i); break;
    case 'step': { const s = getSession(currentW(), true); s.steps[+d.i] = !s.steps[+d.i]; save(); render(); break; }
    case 'round': { const s = getSession(currentW(), true), max = workoutOf(currentW()).steps.find(x => x.rounds).rounds; s.rounds = Math.max(0, Math.min(max, (s.rounds || 0) + +d.d)); save(); render(); break; }
    case 'finish': finish(); break;
    case 'timer-add': T.end += 15000; T.total += 15000; break;
    case 'timer-skip': stopTimer(); break;
    case 'ci-save': saveCheckin(); break;
    case 'ci-del': if (delArmed === d.date) { S.checkins = S.checkins.filter(c => c.date !== d.date); delArmed = null; save(); render(); toast('Check-in deleted'); } else { delArmed = d.date; t.textContent = 'Delete?'; setTimeout(() => { if (delArmed === d.date) { delArmed = null; t.textContent = '✕'; } }, 3000); } break;
    case 'copy-summary': copySummary(); break;
    case 'pose': photoPose = d.pose; render(); break;
    case 'add-photo': $('#photo-input').click(); break;
    case 'photo': openPhoto(+d.id); break;
    case 'compare': compareFrom = +d.id; closeSheet(); render(); toast('Now tap a second photo'); break;
    case 'compare-cancel': compareFrom = null; render(); break;
    case 'photo-del': if (delArmed === d.id) { await photoDel(+d.id); delArmed = null; closeSheet(); render(); toast('Photo deleted'); } else { delArmed = d.id; t.textContent = 'Tap again to delete'; } break;
    case 'settings': resetArmed = false; openSettings(); break;
    case 'scrim': case 'close': closeSheet(); break;
    case 'export': exportData(d.photos === '1'); break;
    case 'import': $('#import-input').click(); break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; t.textContent = 'Tap again to erase everything'; break; }
      S = freshState(); save(); try { const ph = await photosAll(); for (const p of ph) await photoDel(p.id); } catch (e2) {}
      resetArmed = false; closeSheet(); toast('All data erased'); tab = 'today'; render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) {
    const w = currentW(), ex = workoutOf(w).ex.find(x => x.id === el.dataset.ex), sess = getSession(w, true);
    const f = el.dataset.f, v = f === 'kg' ? cleanKg(el.value) : cleanReps(el.value);
    if (el.value.trim() && !v) toast(f === 'kg' ? 'Use a number for kg, like 12.5' : 'Use a whole number, like 10');
    ensureSets(sess, ex)[+el.dataset.i][f] = v; el.value = v; save();
  } else if (el.dataset.cf) { const s = getSession(currentW(), true); const v = num(el.value); s[el.dataset.cf] = v > 0 ? v : ''; save();
    if (s.km && s.min && s.km / (s.min / 60) > 25) toast(`That’s ${fmt(s.km / (s.min / 60))} km/h — check the distance (2.1, not 21)`); const pl = $('#pace-line'); if (pl) pl.innerHTML = paceLine(s); if (s.km && s.min) { const q = $('[data-act="run-quick"]'); if (q) q.remove(); } refreshWarm(s); }
  else if (el.id === 'photo-input') addPhoto(el.files[0]);
  else if (el.id === 'import-input') importData(el.files[0]);
  else if (el.id === 'log-date') { logDate = el.value; trainSel = null; render(); }
  else if (el.id === 'set-start' && el.value) { S.start = el.value; save(); render(); toast('Start date updated'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// Re-render when the app comes back after midnight
let lastDay = todayKey();
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== lastDay) { lastDay = todayKey(); logDate = todayKey(); viewOff = 0; trainSel = null; render(); } });

render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
